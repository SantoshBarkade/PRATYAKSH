<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A30" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="pMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="100%" stop-color="#142B47" />
    </linearGradient>
    <linearGradient id="pRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#1C3554" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="swooshUnder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- Left Pillar (Slopes up) -->
  <path d="M 18 42 L 34 26 L 34 76 L 18 76 Z" fill="url(#pLeftGrad)" />
  <!-- Left Pillar Bevel / Inner Shadow -->
  <path d="M 28 32 L 34 26 L 34 76 L 28 76 Z" fill="#0A1526" opacity="0.35" />

  <!-- Center Pillar (Tallest) -->
  <path d="M 40 8 L 56 16 L 56 76 L 40 76 Z" fill="url(#pMidGrad)" />
  <path d="M 48 12 L 56 16 L 56 76 L 48 76 Z" fill="#040D1A" opacity="0.4" />

  <!-- Right Pillar (Slopes down) -->
  <path d="M 62 26 L 78 40 L 78 76 L 62 76 Z" fill="url(#pRightGrad)" />
  <path d="M 62 26 L 70 33 L 70 76 L 62 76 Z" fill="#071424" opacity="0.3" />

  <!-- Under-shadow of road ribbon -->
  <path d="M 14 65 C 28 48, 48 46, 68 54 C 78 58, 86 66, 92 78 L 84 80 C 78 68, 70 60, 58 56 C 42 50, 26 56, 16 68 Z" fill="url(#swooshUnder)" opacity="0.85" />

  <!-- Green Dynamic Highway Ribbon -->
  <path d="M 14 62 C 26 44, 48 40, 68 49 C 80 54, 88 64, 94 76 C 88 77, 80 75, 74 68 C 62 54, 46 47, 30 52 C 22 55, 17 60, 14 62 Z" fill="url(#swooshGrad)" />
