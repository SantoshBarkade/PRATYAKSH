<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="pLeftGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2137" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <linearGradient id="pMidGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081526" />
      <stop offset="100%" stop-color="#142B47" />
    </linearGradient>
    <linearGradient id="pRightGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#1C3554" />
    </linearGradient>
    <linearGradient id="swooshGradL" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Left Mark (scaled to fit within 75x75 at x=2, y=2) -->
  <g transform="translate(2, 2) scale(0.76)">
    <!-- Left Pillar -->
    <path d="M 18 42 L 34 26 L 34 76 L 18 76 Z" fill="url(#pLeftGradL)" />
    <path d="M 28 32 L 34 26 L 34 76 L 28 76 Z" fill="#0A1526" opacity="0.35" />

    <!-- Center Pillar -->
    <path d="M 40 8 L 56 16 L 56 76 L 40 76 Z" fill="url(#pMidGradL)" />
    <path d="M 48 12 L 56 16 L 56 76 L 48 76 Z" fill="#040D1A" opacity="0.4" />

    <!-- Right Pillar -->
    <path d="M 62 26 L 78 40 L 78 76 L 62 76 Z" fill="url(#pRightGradL)" />
    <path d="M 62 26 L 70 33 L 70 76 L 62 76 Z" fill="#071424" opacity="0.3" />

    <!-- Under-shadow -->
    <path d="M 14 65 C 28 48, 48 46, 68 54 C 78 58, 86 66, 92 78 L 84 80 C 78 68, 70 60, 58 56 C 42 50, 26 56, 16 68 Z" fill="#047857" opacity="0.85" />

    <!-- Green Highway Ribbon -->
    <path d="M 14 62 C 26 44, 48 40, 68 49 C 80 54, 88 64, 94 76 C 88 77, 80 75, 74 68 C 62 54, 46 47, 30 52 C 22 55, 17 60, 14 62 Z" fill="url(#swooshGradL)" />
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(82, 0)">
    <!-- InfraLink Text -->
    <text x="0" y="44" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="36" fill="#0F172A" letter-spacing="-0.02em">
      Infra<tspan font-weight="600">L</tspan><tspan font-weight="600" dx="0">ı</tspan><tspan font-weight="600" dx="0">nk</tspan>
    </text>

    <!-- Green Dot / Accent for the 'i' in Link -->
    <!-- Positioned precisely over the dotless i (around x=142, y=20) -->
    <path d="M 141 18 C 143 14, 148 13, 151 17 C 147 22, 143 23, 141 18 Z" fill="#10B981" />

    <!-- Tagline -->
    <text x="1" y="64" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="11.5" fill="#475569" letter-spacing="0.01em">
      Connect Plans. Track Progress. Predict Impact.
    </text>
  </g>
</svg>
